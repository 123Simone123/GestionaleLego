name: PDF check

# Genera un PDF di esempio su un emulatore Android per controllare l'impaginazione.
on:
  workflow_dispatch:
  push:
    branches: [ dev ]
    paths: [ 'app/src/main/java/com/brickarchivio/app/export/**', 'app/src/androidTest/**', '.github/workflows/pdf-check.yml' ]

jobs:
  pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Abilita KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Compila APK app e test
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest
      - name: Emulatore, test e PDF
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -e class com.brickarchivio.app.export.PdfWriterTest com.brickarchivio.app.test/androidx.test.runner.AndroidJUnitRunner
            adb pull /sdcard/Android/data/com.brickarchivio.app/files/sample-inventario.pdf sample.pdf || adb shell "run-as com.brickarchivio.app cat files/sample-inventario.pdf" > sample.pdf
            ls -la sample.pdf
            echo "=== SAMPLE_PDF" && base64 -w0 sample.pdf && echo
