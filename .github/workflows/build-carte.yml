name: Build APK Carte Fedelta

on:
  push:
    branches: [ carte-fedelta ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Compila APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testReleaseUnitTest assembleRelease

      - name: Rinomina APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/CarteFedelta-${{ github.run_number }}.apk

      - name: Carica come artifact
        uses: actions/upload-artifact@v4
        with:
          name: CarteFedelta-apk
          path: out/*.apk

      # Dal telefono: pagina "Releases" del repository -> CarteFedelta-N.apk
      - name: Pubblica release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: carte-build-${{ github.run_number }}
          name: Carte Fedeltà build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: false
          body: APK di Carte Fedeltà compilato automaticamente dal commit ${{ github.sha }}.
          files: out/*.apk
