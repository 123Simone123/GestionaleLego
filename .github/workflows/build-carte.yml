name: Build APK FreeCard

on:
  push:
    branches: [ carte-fedelta ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Compila APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testReleaseUnitTest assembleRelease

      - name: Rinomina APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/FreeCard-${{ github.run_number }}.apk

      - name: Carica come artifact
        uses: actions/upload-artifact@v4
        with:
          name: FreeCard-apk
          path: out/*.apk

      # Dal telefono: pagina "Releases" del repository -> FreeCard-N.apk
      - name: Pubblica release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: freecard-build-${{ github.run_number }}
          name: FreeCard build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: false
          body: APK di FreeCard compilato automaticamente dal commit ${{ github.sha }}.
          files: out/*.apk

  # Webapp (per iPhone e qualsiasi browser), pubblicata con GitHub Pages dal ramo gh-pages
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepara il sito
        run: |
          mkdir -p /tmp/libs && cd /tmp/libs
          npm init -y > /dev/null
          npm install --no-audit --no-fund @zxing/library@^0.21.0 bwip-js@^3 zxing-wasm@^2
          echo '--- zxing-wasm'; cat node_modules/zxing-wasm/package.json | head -40; find node_modules/zxing-wasm/dist -maxdepth 3 | grep -i 'iife\|wasm$' | head -30
          ls node_modules/@zxing/library/umd node_modules/bwip-js/dist || true
          cd "$GITHUB_WORKSPACE"
          rm -rf site && cp -r web site && rm -rf site/tools
          mkdir -p site/vendor
          cp /tmp/libs/node_modules/@zxing/library/umd/index.min.js site/vendor/zxing.min.js
          cp /tmp/libs/node_modules/bwip-js/dist/bwip-js-min.js site/vendor/bwip-js-min.js
          # zxing-cpp in WebAssembly (lettore più robusto)
          cp /tmp/libs/node_modules/zxing-wasm/dist/iife/reader/index.js site/vendor/zxing-wasm-reader.js
          cp "$(find /tmp/libs/node_modules/zxing-wasm/dist -name 'zxing_reader.wasm' | head -1)" site/vendor/zxing_reader.wasm
          sed -i "s/__BUILD__/${{ github.run_number }}/g" site/*.html site/*.js
          touch site/.nojekyll

      - name: Controlla librerie e codici
        run: NODE_PATH=/tmp/libs/node_modules node web/tools/check-vendor.js site

      - name: Pubblica su gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          force_orphan: true
